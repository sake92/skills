name: customer-repository
skill: pragmatic-architecture
section: "1. Small interfaces and encapsulation"
prompt: prompt.md
starter: starter
grading:
  deterministic:
    command: scala-cli test WORK grading --server=false
    files:
      - grading/BehaviorSuite.scala
      - grading/StructureSuite.scala
      - grading/project.scala
  judge:
    rubric: grading/judge.md
    criteria:
      - proportionality
      - unjustified DTO or wrapper types
